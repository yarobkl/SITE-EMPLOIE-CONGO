name: Finalize auth flows
on:
  push:
    branches:
      - agent/auth-complete
permissions:
  contents: write
jobs:
  auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/auth_complete_patch.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx
          git commit -m "feat: complete login signup and Apple auth flows"
          git push origin HEAD:agent/auth-complete
