name: Finalize password recovery route

on:
  push:
    branches:
      - agent/password-recovery-email
    paths:
      - .github/workflows/finalize-password-recovery-route.yml

permissions:
  contents: write

jobs:
  patch-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/password-recovery-email
      - name: Use dedicated recovery route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()
          old = "resetPasswordForEmail(email, { redirectTo: getWebUrlForPath('/profil') })"
          new = "resetPasswordForEmail(email, { redirectTo: getWebUrlForPath('/nouveau-mot-de-passe') })"
          if old not in text:
              raise SystemExit('Expected recovery redirect not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: use dedicated password recovery route"
          git push origin HEAD:agent/password-recovery-email
