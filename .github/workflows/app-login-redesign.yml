name: Apply app login redesign
on:
  push:
    branches:
      - agent/login-app-redesign
permissions:
  contents: write
jobs:
  redesign:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/login-app-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Redesign login and native overlays
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace('''    <div className="mx-auto max-w-md space-y-5">\n      <BackButton onClick={() => setScreen('home')} label="Accueil" />\n      <PageHeader title={loginTitle} subtitle={loginSubtitle} />''', '''    <div className="mx-auto w-full max-w-md space-y-6 px-1 pb-8 pt-1">\n      <div className="flex items-center justify-between gap-3">\n        <button type="button" onClick={() => setScreen('home')} className="flex min-h-11 items-center gap-3 rounded-xl pr-3 text-left focus:outline-none focus:ring-2 focus:ring-blue-600">\n          <span className="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-700 to-blue-500 text-xl font-black text-white shadow-sm">N</span>\n          <span><span className="block text-xl font-black tracking-tight text-slate-950">Nzela <span className="text-blue-600">Jobs</span></span><span className="block text-xs font-medium text-slate-500">L'emploi au Congo, plus simple.</span></span>\n        </button>\n        <span className="text-sm font-semibold text-slate-600">Français</span>\n      </div>\n      <div><h1 className="text-[2rem] font-black tracking-tight text-slate-950">Bienvenue</h1><p className="mt-2 text-base font-medium leading-7 text-slate-500">Connectez-vous pour accéder à votre espace et gérer vos opportunités.</p></div>''')
          s = s.replace('grid grid-cols-2 rounded-lg border border-slate-200 bg-slate-50 p-1', 'grid grid-cols-2 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm')
          s = s.replace("'min-h-11 rounded-md text-sm font-semibold transition-colors'", "'min-h-[5.2rem] px-3 py-3 text-base font-black transition-colors'")
          s = s.replace('>\n          Candidat\n        </button>', '>\n          <span className="block">Candidat</span><span className="mt-1 block text-xs font-medium">Je cherche un emploi</span>\n        </button>')
          s = s.replace('>\n          Recruteur\n        </button>', '>\n          <span className="block">Recruteur</span><span className="mt-1 block text-xs font-medium">Je recrute des talents</span>\n        </button>')
          s = s.replace('>\n          Connexion\n        </button>', '>\n          Se connecter\n        </button>')
          s = s.replace('>\n          Inscription\n        </button>', '>\n          Créer un compte\n        </button>')
          s = s.replace('rounded-lg border border-slate-300 bg-white px-5 text-sm font-semibold', 'rounded-xl border border-slate-300 bg-white px-5 text-sm font-bold shadow-sm')
          s = s.replace('rounded-lg bg-slate-950 px-5 text-sm font-semibold', 'rounded-xl bg-slate-950 px-5 text-sm font-bold shadow-sm')
          s = s.replace('className="space-y-4 rounded-xl border border-slate-200 bg-white p-5"', 'className="space-y-4"')
          s = s.replace('className="primary-button w-full"', 'className="flex min-h-14 w-full items-center justify-center rounded-xl bg-gradient-to-r from-blue-700 to-blue-500 px-5 text-base font-black text-white shadow-lg shadow-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-600"')
          s = s.replace("`Me connecter comme ${isRecruiterLogin ? 'recruteur' : 'candidat'}`", "`Se connecter comme ${isRecruiterLogin ? 'recruteur' : 'candidat'}`")
          p.write_text(s)

          d = Path('src/DeferredPlatformEnhancements.jsx')
          t = d.read_text()
          if "@capacitor/core" not in t:
            t = t.replace("import { lazy, Suspense, useEffect, useState } from 'react';", "import { lazy, Suspense, useEffect, useState } from 'react';\nimport { Capacitor } from '@capacitor/core';")
          t = t.replace("  const [ready, setReady] = useState(false);", "  const [ready, setReady] = useState(false);\n  const nativeApp = Capacitor.isNativePlatform();")
          t = t.replace('      <PrivacyComplianceExperience />', '      {!nativeApp && <PrivacyComplianceExperience />}')
          t = t.replace('      <TalentMarketplaceExperience />', '      {!nativeApp && <TalentMarketplaceExperience />}')
          d.write_text(t)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit redesign
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx src/DeferredPlatformEnhancements.jsx
          git commit -m "feat: redesign app login experience"
          git push origin HEAD:agent/login-app-redesign
