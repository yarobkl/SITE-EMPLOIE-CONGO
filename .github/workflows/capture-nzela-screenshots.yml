name: Capture Nzela screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Capture public product screens
        run: |
          mkdir -p investor-screenshots
          cat > capture.cjs <<'EOF'
          const { chromium } = require('playwright');

          const base = 'https://site-emploie-congo.vercel.app';

          async function waitReady(page) {
            await page.waitForLoadState('domcontentloaded');
            await page.waitForTimeout(4000);
            await page.evaluate(() => window.scrollTo(0, 0));
          }

          async function shot(page, name) {
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.screenshot({ path: `investor-screenshots/${name}.png`, fullPage: true });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const desktop = await browser.newContext({
                viewport: { width: 1440, height: 1000 },
                deviceScaleFactor: 1,
                locale: 'fr-FR',
              });
              const page = await desktop.newPage();

              await page.goto(`${base}/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await waitReady(page);
              await shot(page, '01-accueil-desktop');

              await page.goto(`${base}/offres`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await waitReady(page);
              await shot(page, '02-offres-desktop');

              const firstCardButton = page.locator('.job-card button').first();
              if (await firstCardButton.count()) {
                await firstCardButton.click();
                await page.waitForTimeout(3000);
              }
              await shot(page, '03-detail-offre-desktop');

              const applyButton = page.getByRole('button', { name: /postuler/i }).first();
              if (await applyButton.count()) {
                await applyButton.click();
                await page.waitForTimeout(3000);
              }
              await shot(page, '04-candidature-desktop');

              const loginButton = page.getByRole('button', { name: /connexion|se connecter/i }).first();
              if (await loginButton.count()) {
                await loginButton.click();
                await page.waitForTimeout(2500);
              } else {
                await page.goto(`${base}/connexion`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await waitReady(page);
              }
              await shot(page, '05-connexion-desktop');
              await desktop.close();

              const mobile = await browser.newContext({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 2,
                isMobile: true,
                hasTouch: true,
                locale: 'fr-FR',
              });
              const mobilePage = await mobile.newPage();

              await mobilePage.goto(`${base}/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await waitReady(mobilePage);
              await shot(mobilePage, '06-accueil-mobile');

              await mobilePage.goto(`${base}/offres`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await waitReady(mobilePage);
              await shot(mobilePage, '07-offres-mobile');
              await mobile.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF
          node capture.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nzela-investor-screenshots
          path: investor-screenshots/*.png
          if-no-files-found: error
          retention-days: 1
