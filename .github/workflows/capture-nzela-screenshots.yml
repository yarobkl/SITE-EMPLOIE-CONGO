name: Capture Nzela screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Capture public product screens
        run: |
          mkdir -p investor-screenshots
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const base = 'https://site-emploie-congo.vercel.app';
          const browser = await chromium.launch({ headless: true });

          async function waitReady(page) {
            await page.waitForLoadState('domcontentloaded');
            await page.waitForTimeout(3500);
            await page.evaluate(() => window.scrollTo(0, 0));
          }

          const desktop = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
            locale: 'fr-FR',
          });
          const page = await desktop.newPage();

          await page.goto(`${base}/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await waitReady(page);
          await page.screenshot({ path: 'investor-screenshots/01-accueil-desktop.png', fullPage: true });

          await page.goto(`${base}/offres`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await waitReady(page);
          await page.screenshot({ path: 'investor-screenshots/02-offres-desktop.png', fullPage: true });

          const firstCardButton = page.locator('.job-card button').first();
          if (await firstCardButton.count()) {
            await firstCardButton.click();
            await page.waitForTimeout(2500);
          } else {
            const fallback = page.getByRole('button').filter({ hasText: /voir|d[ée]tail|ouvrir/i }).first();
            if (await fallback.count()) {
              await fallback.click();
              await page.waitForTimeout(2500);
            }
          }
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.screenshot({ path: 'investor-screenshots/03-detail-offre-desktop.png', fullPage: true });

          const applyButton = page.getByRole('button', { name: /postuler/i }).first();
          if (await applyButton.count()) {
            await applyButton.click();
            await page.waitForTimeout(2500);
          }
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.screenshot({ path: 'investor-screenshots/04-candidature-desktop.png', fullPage: true });

          await page.goto(`${base}/connexion`, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(() => {});
          await waitReady(page);
          await page.screenshot({ path: 'investor-screenshots/05-connexion-desktop.png', fullPage: true });
          await desktop.close();

          const mobile = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            locale: 'fr-FR',
          });
          const mobilePage = await mobile.newPage();

          await mobilePage.goto(`${base}/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await waitReady(mobilePage);
          await mobilePage.screenshot({ path: 'investor-screenshots/06-accueil-mobile.png', fullPage: true });

          await mobilePage.goto(`${base}/offres`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await waitReady(mobilePage);
          await mobilePage.screenshot({ path: 'investor-screenshots/07-offres-mobile.png', fullPage: true });

          await mobile.close();
          await browser.close();
          EOF
          node /tmp/capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nzela-investor-screenshots
          path: investor-screenshots/*.png
          retention-days: 1
