name: Apply home redesign
on:
  push:
    branches:
      - agent/home-redesign-v2
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-redesign-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply_home_redesign.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx src/DeferredPlatformEnhancements.jsx
          git commit -m "feat: redesign Nzela home experience"
          git push origin HEAD:agent/home-redesign-v2
