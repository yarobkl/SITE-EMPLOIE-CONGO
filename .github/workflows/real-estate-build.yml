name: Real estate build

on:
  push:
    branches:
      - feature/nzela-immo-actual-work-final2
  pull_request:
    branches:
      - compliance/nzela-legal-v2-20260802

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
