name: Regenerate nanoid lockfile

on:
  push:
    branches:
      - agent/password-recovery-email
    paths:
      - package.json
      - .github/workflows/fix-nanoid-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/password-recovery-email

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched nanoid
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/nanoid']?.version !== '3.3.18') process.exit(1); console.log('nanoid', p.packages['node_modules/nanoid'].version)"
          npm audit --audit-level=high

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate lockfile with nanoid 3.3.18"
          git push origin HEAD:agent/password-recovery-email
