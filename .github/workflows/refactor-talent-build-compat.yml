name: Refactor talent build compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - src/TalentMarketplaceExperience.jsx
      - .github/workflows/refactor-talent-build-compat.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move compatibility fixes into source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/TalentMarketplaceExperience.jsx')
          text = path.read_text()
          text = text.replace('BriefcaseBusiness', 'Briefcase')
          text = text.replace('UserRoundSearch', 'User')
          path.write_text(text)
          PY
      - name: Verify source no longer needs icon rewrite
        run: |
          ! grep -q "BriefcaseBusiness" src/TalentMarketplaceExperience.jsx
          ! grep -q "UserRoundSearch" src/TalentMarketplaceExperience.jsx
      - name: Commit source refactor
        run: |
          if git diff --quiet -- src/TalentMarketplaceExperience.jsx; then
            echo "Already refactored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TalentMarketplaceExperience.jsx
          git commit -m "Intégrer la compatibilité Talents dans le source"
          git push origin HEAD:${{ github.head_ref }}
